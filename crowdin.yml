# Fynvi Share Crowdin Configuration
# Docs: https://crowdin.com/project/fynvi-share

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
base_url: "https://api.crowdin.com"
preserve_hierarchy: true

files:
  # Frontend TypeScript Dictionary
  - source: /frontend/src/i18n/translations/en-US.ts
    translation: /frontend/src/i18n/translations/%locale%.ts
    languages_mapping: &locale_map
      locale:
        ar-EG: ar-EG
        bg-BG: bg-BG
        ca-ES: ca-ES
        cs-CZ: cs-CZ
        da-DK: da-DK
        de-DE: de-DE
        el-GR: el-GR
        en-US: en-US
        es-ES: es-ES
        et-EE: et-EE
        fa-IR: fa-IR
        fi-FI: fi-FI
        fr-FR: fr-FR
        hr-HR: hr-HR
        hu-HU: hu-HU
        it-IT: it-IT
        ja-JP: ja-JP
        ko-KR: ko-KR
        nl-BE: nl-BE
        no-NO: no-NO
        pl-PL: pl-PL
        pt-BR: pt-BR
        ru-RU: ru-RU
        sl-SI: sl-SI
        sr-CS: sr-CS
        sr-SP: sr-SP
        sv-SE: sv-SE
        th-TH: th-TH
        tr-TR: tr-TR
        uk-UA: uk-UA
        vi-VN: vi-VN
        zh-CN: zh-CN
        zh-TW: zh-TW

  # Backend JSON Namespaces
  - source: /backend/src/i18n/en-US/*.json
    translation: /backend/src/i18n/%locale%/%original_file_name%
    languages_mapping: *locale_map

pull_request_title: "chore(translations): sync translations from Crowdin"
pull_request_labels:
  - "translations"
  - "crowdin"

